name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }} x64)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          version: 0.12.23

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install build dependencies
        run: uv sync --frozen --group build

      - name: Run tests
        run: uv run pytest

      - name: Build release assets
        run: uv run python scripts/build_release.py

      - name: Smoke test the standalone binary
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            uv run --group build python scripts/smoke_release.py ./dist/send-minecraft-notifications.exe
          else
            uv run --group build python scripts/smoke_release.py ./dist/send-minecraft-notifications
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-x64
          path: dist/release/*${{ matrix.platform }}-x64*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Assemble draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*-x64
          path: release-assets
          merge-multiple: true

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --json isDraft --jq '.isDraft' > release-state.txt 2>/dev/null; then
            if [ "$(cat release-state.txt)" != "true" ]; then
              echo "Refusing to replace assets on an already published release." >&2
              exit 1
            fi
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* --verify-tag --draft --title "$TAG_NAME"
          fi
