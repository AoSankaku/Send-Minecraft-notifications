name: Build and release

on:
  push:
    branches: [main]
    tags:
      - "**"
    paths:
      - .github/workflows/**
      - scripts/**
      - src/**
      - translations/**
      - pyproject.toml
      - uv.lock
      - .python-version
      - '*.spec'
      - send-minecraft-notifications.example.toml
      - README.md
      - LICENSE
  pull_request:
    paths:
      - .github/workflows/**
      - scripts/**
      - src/**
      - translations/**
      - pyproject.toml
      - uv.lock
      - .python-version
      - '*.spec'
      - send-minecraft-notifications.example.toml
      - README.md
      - LICENSE
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional release tag to validate without publishing
        required: false
        type: string

concurrency:
  group: standalone-release-${{ github.ref }}
  # Keep tag builds; superseded branch/PR checks need not finish.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  publishing-checks:
    name: Check release publishing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test release publishing without network requests
        run: python3 scripts/test_publish_release.py

  build:
    name: Build (${{ matrix.platform }} x64)
    needs: publishing-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    permissions:
      contents: read
    env:
      SMN_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_version || '' }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          version: 0.12.23

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install build dependencies
        run: uv sync --frozen --group build

      - name: Run tests
        run: uv run pytest

      - name: Test Windows executable naming
        if: matrix.platform == 'windows'
        run: uv run python scripts/test_build_release.py

      - name: Test release documentation
        run: uv run python scripts/test_release_docs.py

      - name: Build release assets
        # The builder embeds a README generated from the release tag.
        run: uv run python scripts/build_release.py

      - name: Smoke test the standalone binary
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            uv run --group build python scripts/smoke_release.py ./dist/send-minecraft-notifications.exe
          else
            uv run --group build python scripts/smoke_release.py ./dist/send-minecraft-notifications
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-x64
          path: |
            dist/release/*${{ matrix.platform }}-x64*
            dist/release/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: standalone-publish-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all platform assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*-x64
          path: release-assets
          merge-multiple: true

      - name: Verify assets and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: bash scripts/publish_release.sh release-assets

      - name: Update repository README for the newest published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: python3 scripts/release_docs.py sync-readme --tag "$TAG_NAME"
