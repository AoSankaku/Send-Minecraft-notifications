name: Release publishing checks

on:
  push:
    branches: [main]
    paths:
      - scripts/publish_release.sh
      - scripts/test_publish_release.py
      - scripts/build_release.py
      - scripts/release_docs.py
      - .github/workflows/release-checks.yml
  pull_request:
    paths:
      - scripts/publish_release.sh
      - scripts/test_publish_release.py
      - scripts/build_release.py
      - scripts/release_docs.py
      - .github/workflows/release-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publishing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test release publishing without network requests
        run: python3 scripts/test_publish_release.py
